<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Subtitle Assistant</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      width: 348px;
      margin: 0;
      padding: 14px 16px;
      background: #18191e;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "PingFang SC", sans-serif;
      font-size: 13px;
    }
    .popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    h2 {
      margin: 0;
      font-size: 15px;
      color: #ff7849;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .popup-lang-select {
      width: auto;
      padding: 3px 7px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.4);
      color: #f3f4f6;
      font-size: 11px;
      cursor: pointer;
    }
    .field {
      margin-bottom: 10px;
    }
    .field > label {
      display: block;
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 4px;
    }
    .popup-input {
      width: 100%;
      padding: 7px 9px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-size: 12px;
      box-sizing: border-box;
      -webkit-text-fill-color: #fff;
      caret-color: #fff;
      opacity: 1;
    }
    .popup-input::placeholder {
      color: #9ca3af;
      -webkit-text-fill-color: #9ca3af;
      opacity: 1;
    }
    .popup-btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      background: #eb5528;
      color: #fff;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      margin-top: 6px;
    }
    .popup-btn:hover {
      background: #ff6a3d;
    }
    .popup-btn.secondary {
      background: rgba(255,255,255,0.12);
    }
    .popup-btn.secondary:hover {
      background: rgba(255,255,255,0.2);
    }
    .hint {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 10px;
      line-height: 1.45;
    }
    a {
      color: #ff7849;
    }
    /* Match dark inputs inside the shared source accordion widget */
    #popup-source-mount .dsub-input {
      padding: 5px 7px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-size: 12px;
      box-sizing: border-box;
    }
    #popup-source-mount .dsub-source-add-name {
      flex: 1;
      min-width: 0;
    }
    #popup-source-mount .dsub-btn {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.1);
      color: #f3f4f6;
      font-size: 11px;
      cursor: pointer;
    }
    #popup-source-mount .dsub-btn:hover {
      background: rgba(255,255,255,0.18);
    }
  </style>
</head>
<body>
  <div class="popup-header">
    <h2 id="popupTitle">🎬 Subtitle Assistant</h2>
    <select id="languageSelect" class="popup-lang-select" aria-label="Language">
      <option value="en">English</option>
      <option value="ja">日本語</option>
      <option value="zh_CN">简体中文</option>
    </select>
  </div>
  <div class="field">
    <label for="apiKey" id="apiKeyLabel"></label>
    <input type="text" id="apiKey" class="popup-input" autocomplete="off" spellcheck="false" style="-webkit-text-security: disc;" />
  </div>
  <div class="field" id="popup-source-mount"></div>
  <button id="saveBtn" class="popup-btn"></button>
  <button id="togglePanelBtn" class="popup-btn secondary"></button>
  <div class="hint" id="popupHint"></div>
  <script src="i18n.js"></script>
  <script src="source_profiles.js"></script>
  <script src="popup.js"></script>
</body>
</html>
