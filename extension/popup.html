<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>字幕アシスタント (dアニメ・Prime)</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 14px 16px;
      background: #18191e;
      color: #f3f4f6;
      font-family: "Noto Sans JP", "Hiragino Sans", sans-serif;
      font-size: 13px;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 15px;
      color: #ff7849;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .field {
      margin-bottom: 10px;
    }
    .field > label {
      display: block;
      font-size: 11px;
      color: #9ca3af;
      margin-bottom: 4px;
    }
    .popup-input {
      width: 100%;
      padding: 7px 9px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-size: 12px;
      box-sizing: border-box;
      -webkit-text-fill-color: #fff;
      caret-color: #fff;
      opacity: 1;
    }
    .popup-input::placeholder {
      color: #9ca3af;
      -webkit-text-fill-color: #9ca3af;
      opacity: 1;
    }
    .popup-btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      background: #eb5528;
      color: #fff;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      margin-top: 6px;
    }
    .popup-btn:hover {
      background: #ff6a3d;
    }
    .popup-btn.secondary {
      background: rgba(255,255,255,0.12);
    }
    .popup-btn.secondary:hover {
      background: rgba(255,255,255,0.2);
    }
    .hint {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 10px;
      line-height: 1.45;
    }
    a {
      color: #ff7849;
    }
    /* Match dark inputs inside the shared source accordion widget */
    #popup-source-mount .dsub-input {
      padding: 5px 7px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(0,0,0,0.35);
      color: #fff;
      font-size: 12px;
      box-sizing: border-box;
    }
    #popup-source-mount .dsub-source-add-name {
      flex: 1;
      min-width: 0;
    }
    #popup-source-mount .dsub-btn {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.1);
      color: #f3f4f6;
      font-size: 11px;
      cursor: pointer;
    }
    #popup-source-mount .dsub-btn:hover {
      background: rgba(255,255,255,0.18);
    }
  </style>
</head>
<body>
  <h2>🎬 字幕アシスタント</h2>
  <div class="field">
    <label for="apiKey">Jimaku.cc APIキー (<a href="https://jimaku.cc/account" target="_blank" rel="noopener">無料取得</a>)</label>
    <input type="text" id="apiKey" class="popup-input" autocomplete="off" spellcheck="false" style="-webkit-text-security: disc;" placeholder="APIキーを入力..." />
  </div>
  <div class="field" id="popup-source-mount"></div>
  <button id="saveBtn" class="popup-btn">設定を保存</button>
  <button id="togglePanelBtn" class="popup-btn secondary">再生画面の字幕パネルを開閉</button>
  <div class="hint">
    ・再生画面右上の「💬 字幕」ボタンから自動検索・ファイル読込が使えます。<br/>
    ・オフセット調整値は作品・ソースごとに自動記憶されます。<br/>
    ・ショートカット: <b>Alt+S</b> (表示切替), <b>[ / ]</b> (0.5秒ズレ補正)
  </div>
  <script src="source_profiles.js"></script>
  <script src="popup.js"></script>
</body>
</html>
