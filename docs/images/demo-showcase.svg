<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Anime Subtitle Extension Feature Overview">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#131824" />
    </linearGradient>
    <marker id="flowArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#ff7849" />
    </marker>
  </defs>

  <rect width="1200" height="380" rx="18" fill="url(#bg)" />
  <rect x="1" y="1" width="1198" height="378" rx="17" fill="none" stroke="rgba(255,255,255,0.12)" />

  <g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans JP', sans-serif">
    <!-- Left Card: Auto-Match & Overlay -->
    <g transform="translate(36, 28)">
      <rect width="554" height="324" rx="14" fill="#161b26" stroke="rgba(255,255,255,0.12)" />
      <text x="24" y="36" fill="#ffffff" font-size="17" font-weight="800">Auto-Match &amp; Overlay</text>

      <!-- Platform Pills + Search Pipeline -->
      <rect x="24" y="56" width="120" height="30" rx="8" fill="rgba(235,85,40,0.18)" stroke="#eb5528" />
      <text x="84" y="76" text-anchor="middle" fill="#ffae92" font-size="12" font-weight="700">d-anime Store</text>

      <rect x="154" y="56" width="120" height="30" rx="8" fill="rgba(0,168,225,0.16)" stroke="#00a8e1" />
      <text x="214" y="76" text-anchor="middle" fill="#7dd3fc" font-size="12" font-weight="700">Prime Video</text>

      <line x1="286" y1="71" x2="328" y2="71" stroke="#ff7849" stroke-width="2" marker-end="url(#flowArrow)" />

      <rect x="338" y="56" width="192" height="30" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.16)" />
      <text x="434" y="76" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">AniList + Jimaku.cc</text>

      <!-- Clean Player Overlay Frame -->
      <rect x="24" y="106" width="506" height="190" rx="10" fill="#0b0e14" stroke="rgba(255,255,255,0.14)" />
      <rect x="40" y="122" width="180" height="24" rx="6" fill="rgba(255,255,255,0.07)" />
      <text x="130" y="138" text-anchor="middle" fill="#cbd5e1" font-size="11.5" font-weight="600">Anime Title · Ep 25</text>

      <text x="277" y="252" text-anchor="middle" fill="#000000" stroke="#000000" stroke-width="4" stroke-linejoin="round" font-size="19" font-weight="700">「大丈夫、きっとうまくいくよ。」</text>
      <text x="277" y="252" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">「大丈夫、きっとうまくいくよ。」</text>

      <rect x="44" y="274" width="466" height="4" rx="2" fill="rgba(255,255,255,0.15)" />
      <rect x="44" y="274" width="290" height="4" rx="2" fill="#eb5528" />
    </g>

    <!-- Right Card: Click-to-Sync & Source Offset -->
    <g transform="translate(610, 28)">
      <rect width="554" height="324" rx="14" fill="#161b26" stroke="rgba(255,255,255,0.12)" />
      <text x="24" y="36" fill="#ffffff" font-size="17" font-weight="800">Click-to-Sync &amp; Source Offset</text>

      <!-- Mini Transcript Sync Box -->
      <rect x="24" y="56" width="506" height="106" rx="10" fill="#0d1117" stroke="rgba(255,255,255,0.14)" />
      <text x="40" y="82" fill="#64748b" font-size="12">01:38.2   でも、それだけじゃない。</text>
      <rect x="34" y="92" width="486" height="32" rx="6" fill="rgba(235,85,40,0.24)" stroke="#eb5528" />
      <text x="44" y="113" fill="#ffffff" font-size="13" font-weight="700">01:42.3   「ここから先が、本当の見せ場だね。」</text>
      <text x="506" y="113" text-anchor="end" fill="#ff9d7a" font-size="11.5" font-weight="700">Click to sync</text>
      <text x="40" y="146" fill="#64748b" font-size="12">01:46.8   準備はできているか？</text>

      <!-- Compact Source Priority & Default Offset List -->
      <g transform="translate(24, 178)">
        <rect width="506" height="34" rx="7" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" />
        <text x="16" y="22" fill="#94a3b8" font-size="12">⋮⋮  1   ABEMA</text>
        <text x="486" y="22" text-anchor="end" fill="#cbd5e1" font-size="12" font-weight="600">0.0s</text>

        <rect y="42" width="506" height="34" rx="7" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
        <text x="16" y="64" fill="#94a3b8" font-size="12">⋮⋮  2   Other</text>
        <text x="486" y="64" text-anchor="end" fill="#94a3b8" font-size="12">0.0s Fixed 🔒</text>

        <rect y="84" width="506" height="34" rx="7" fill="rgba(235,85,40,0.14)" stroke="#eb5528" />
        <text x="16" y="106" fill="#ffffff" font-size="12" font-weight="700">⋮⋮  3   Netflix</text>
        <text x="486" y="106" text-anchor="end" fill="#ff9d7a" font-size="12" font-weight="700">-1.0s</text>
      </g>
    </g>
  </g>
</svg>
