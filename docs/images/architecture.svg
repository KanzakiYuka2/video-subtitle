<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Modular Player Adapter Flow Diagram">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#141925" />
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#ff7849" />
    </marker>
  </defs>

  <rect width="1000" height="300" rx="16" fill="url(#archBg)" />
  <rect x="1" y="1" width="998" height="298" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" />

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <!-- Box 1: Player Adapters -->
    <g transform="translate(36, 40)">
      <rect width="268" height="220" rx="12" fill="#161b26" stroke="rgba(255,255,255,0.14)" />
      <text x="20" y="34" fill="#ffffff" font-size="15" font-weight="800">Player Adapters</text>
      <text x="20" y="54" fill="#94a3b8" font-size="12">extension/players/</text>

      <rect x="20" y="72" width="228" height="36" rx="7" fill="rgba(235,85,40,0.16)" stroke="#eb5528" />
      <text x="34" y="95" fill="#ffae92" font-size="13" font-weight="700">danime.js</text>

      <rect x="20" y="118" width="228" height="36" rx="7" fill="rgba(0,168,225,0.14)" stroke="#00a8e1" />
      <text x="34" y="141" fill="#7dd3fc" font-size="13" font-weight="700">prime.js</text>

      <rect x="20" y="164" width="228" height="36" rx="7" fill="rgba(16,185,129,0.1)" stroke="#10b981" stroke-dasharray="5,4" />
      <text x="34" y="187" fill="#6ee7b7" font-size="13" font-weight="700">+ new_player.js</text>
    </g>

    <line x1="312" y1="150" x2="362" y2="150" stroke="#ff7849" stroke-width="2.5" marker-end="url(#arrow)" />

    <!-- Box 2: Registry -->
    <g transform="translate(370, 62)">
      <rect width="260" height="176" rx="12" fill="#181d2a" stroke="#ff7849" stroke-width="1.5" />
      <text x="20" y="36" fill="#ff9d7a" font-size="15" font-weight="800">Player Registry</text>
      <text x="20" y="56" fill="#94a3b8" font-size="12">players/registry.js</text>
      <text x="20" y="94" fill="#e2e8f0" font-size="12.5" font-family="ui-monospace, monospace">SubtitlePlayerRegistry</text>
      <text x="20" y="116" fill="#cbd5e1" font-size="12" font-family="ui-monospace, monospace">.register(adapter)</text>
      <text x="20" y="150" fill="#94a3b8" font-size="12">matches · getVideo · detect</text>
    </g>

    <line x1="638" y1="150" x2="688" y2="150" stroke="#ff7849" stroke-width="2.5" marker-end="url(#arrow)" />

    <!-- Box 3: Core & Background -->
    <g transform="translate(696, 40)">
      <rect width="268" height="220" rx="12" fill="#161b26" stroke="rgba(255,255,255,0.14)" />
      <text x="20" y="34" fill="#ffffff" font-size="15" font-weight="800">Core &amp; Background</text>
      <text x="20" y="54" fill="#94a3b8" font-size="12">content.js · background.js</text>

      <rect x="20" y="76" width="228" height="54" rx="8" fill="rgba(255,255,255,0.04)" />
      <text x="34" y="99" fill="#e2e8f0" font-size="12.5" font-weight="700">Overlay &amp; Sync Engine</text>
      <text x="34" y="117" fill="#94a3b8" font-size="11.5">UI · Transcript · Offset Memory</text>

      <rect x="20" y="144" width="228" height="54" rx="8" fill="rgba(255,255,255,0.04)" />
      <text x="34" y="167" fill="#e2e8f0" font-size="12.5" font-weight="700">Jimaku + AniList Search</text>
      <text x="34" y="185" fill="#94a3b8" font-size="11.5">Split-Cour · Source Priority</text>
    </g>
  </g>
</svg>
