<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Anime Subtitle Extension Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b26" />
    </linearGradient>
    <radialGradient id="glowOrange" cx="15%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#eb5528" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#eb5528" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eb5528" />
      <stop offset="100%" stop-color="#ff7849" />
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bgGrad)" />
  <rect width="1200" height="320" rx="18" fill="url(#glowOrange)" />
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- Left Copy -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans JP', 'PingFang SC', sans-serif">
    <rect x="56" y="54" width="338" height="28" rx="14" fill="rgba(235,85,40,0.16)" stroke="rgba(255,120,73,0.45)" />
    <text x="225" y="73" text-anchor="middle" fill="#ff9d7a" font-size="12" font-weight="700" letter-spacing="0.5">CHROME EXTENSION · d-anime Store &amp; Prime Video</text>

    <text x="56" y="142" fill="#ffffff" font-size="44" font-weight="800">Anime Subtitle</text>
    <text x="56" y="192" fill="url(#accentGrad)" font-size="44" font-weight="800">Extension</text>

    <text x="56" y="236" fill="#cbd5e1" font-size="16.5">Japanese subtitles (<tspan fill="#ffffff" font-weight="600">.ass / .srt / .vtt</tspan>) for streaming anime</text>
    <text x="56" y="262" fill="#94a3b8" font-size="15.5">— auto-search &amp; 1-click timing sync.</text>
  </g>

  <!-- Minimalist 16:9 Anime Player Mockup -->
  <g transform="translate(684, 36)" font-family="system-ui, -apple-system, 'Segoe UI', 'Noto Sans JP', sans-serif">
    <rect width="460" height="248" rx="14" fill="#090c12" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />

    <!-- Clean Frame Scene -->
    <rect x="12" y="12" width="436" height="202" rx="8" fill="#151b28" />
    <path d="M12 162 Q130 112 245 152 T448 134 L448 214 L12 214 Z" fill="#1e2738" />
    <circle cx="104" cy="72" r="24" fill="#eb5528" opacity="0.22" />

    <!-- Single Top-Right FAB Pill -->
    <rect x="330" y="24" width="104" height="28" rx="14" fill="url(#accentGrad)" />
    <text x="382" y="43" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">💬 Subtitles</text>

    <!-- Single Outlined Japanese Subtitle -->
    <text x="230" y="194" text-anchor="middle" fill="#000000" stroke="#000000" stroke-width="4.5" stroke-linejoin="round" font-size="19" font-weight="700">「ここから先が、本当の見せ場だね。」</text>
    <text x="230" y="194" text-anchor="middle" fill="#ffffff" font-size="19" font-weight="700">「ここから先が、本当の見せ場だね。」</text>

    <!-- Minimal Playhead -->
    <rect x="20" y="226" width="420" height="5" rx="2.5" fill="rgba(255,255,255,0.14)" />
    <rect x="20" y="226" width="236" height="5" rx="2.5" fill="#eb5528" />
    <circle cx="256" cy="228.5" r="5.5" fill="#ff7849" />
  </g>
</svg>
